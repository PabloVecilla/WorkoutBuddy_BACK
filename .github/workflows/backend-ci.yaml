name: Backend CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workoutbuddy_user
          POSTGRES_PASSWORD: workoutbuddy_password
          POSTGRES_DB: workoutbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: workoutbuddy_user
      DB_PASSWORD: workoutbuddy_password
      DB_NAME: workoutbuddy_test
      JWT_SECRET: super_secret_change_later

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test